 function categories(){const cats=[...new Set(p.flatMap(x=>x.categories).filter(Boolean))];$('#categories').innerHTML=['',...cats].map(c=>`<button data-cat="${esc(c)}" class="${filter===c?'active':''}">${esc(c||'Todos')}</button>`).join('');$('#menu-categories').innerHTML=['',...cats].map(c=>`<button type="button" data-cat="${esc(c)}" class="${filter===c?'active':''}">${esc(c||'Todos os produtos')} <span aria-hidden="true">→</span></button>`).join('');for(const container of ['#categories','#menu-categories'])$(container).querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;categories();render();if(container==='#menu-categories'){$('#store-menu').close();$('#grid').scrollIntoView({block:'start',behavior:'smooth'})}})}
 function priceMarkup(x,v){const price=v?v.price:x.price,old=v?v.oldPrice:x.oldPrice;return `${old>0?`<div class="price-before"><del>${money(old)}</del>${old>price?`<span class="price-discount">↓ ${Math.round((1-price/old)*100)}%</span>`:''}</div>`:''}<strong>${money(price)}</strong>`}
